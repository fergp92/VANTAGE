<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f85149" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f85149" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d2c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#39d2c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Stars -->
  <g opacity="0.3">
    <circle cx="45" cy="32" r="0.8" fill="#c9d1d9"/><circle cx="120" cy="78" r="0.5" fill="#c9d1d9"/>
    <circle cx="200" cy="15" r="0.7" fill="#c9d1d9"/><circle cx="310" cy="55" r="0.4" fill="#c9d1d9"/>
    <circle cx="380" cy="22" r="0.6" fill="#c9d1d9"/><circle cx="455" cy="90" r="0.5" fill="#c9d1d9"/>
    <circle cx="530" cy="35" r="0.8" fill="#c9d1d9"/><circle cx="620" cy="12" r="0.4" fill="#c9d1d9"/>
    <circle cx="710" cy="68" r="0.6" fill="#c9d1d9"/><circle cx="800" cy="25" r="0.5" fill="#c9d1d9"/>
    <circle cx="880" cy="82" r="0.7" fill="#c9d1d9"/><circle cx="960" cy="18" r="0.4" fill="#c9d1d9"/>
    <circle cx="1040" cy="55" r="0.6" fill="#c9d1d9"/><circle cx="1120" cy="38" r="0.5" fill="#c9d1d9"/>
    <circle cx="1170" cy="72" r="0.8" fill="#c9d1d9"/><circle cx="75" cy="350" r="0.5" fill="#c9d1d9"/>
    <circle cx="150" cy="380" r="0.4" fill="#c9d1d9"/><circle cx="280" cy="365" r="0.6" fill="#c9d1d9"/>
    <circle cx="420" cy="385" r="0.5" fill="#c9d1d9"/><circle cx="550" cy="370" r="0.7" fill="#c9d1d9"/>
    <circle cx="680" cy="390" r="0.4" fill="#c9d1d9"/><circle cx="790" cy="375" r="0.6" fill="#c9d1d9"/>
    <circle cx="920" cy="360" r="0.5" fill="#c9d1d9"/><circle cx="1050" cy="385" r="0.7" fill="#c9d1d9"/>
    <circle cx="1150" cy="370" r="0.4" fill="#c9d1d9"/><circle cx="35" cy="180" r="0.6" fill="#c9d1d9"/>
    <circle cx="1175" cy="200" r="0.5" fill="#c9d1d9"/><circle cx="25" cy="280" r="0.4" fill="#c9d1d9"/>
    <circle cx="1165" cy="310" r="0.7" fill="#c9d1d9"/>
  </g>

  <!-- Constellation connections (edges) -->
  <g stroke-width="0.8" opacity="0.25">
    <!-- META/Orchestration cluster -->
    <line x1="600" y1="120" x2="520" y2="160" stroke="#58a6ff"/>
    <line x1="600" y1="120" x2="680" y2="160" stroke="#58a6ff"/>
    <line x1="600" y1="120" x2="560" y2="80" stroke="#58a6ff"/>
    <line x1="600" y1="120" x2="640" y2="80" stroke="#58a6ff"/>
    <line x1="600" y1="120" x2="600" y2="70" stroke="#58a6ff"/>
    <line x1="520" y1="160" x2="560" y2="80" stroke="#58a6ff"/>
    <line x1="680" y1="160" x2="640" y2="80" stroke="#58a6ff"/>

    <!-- Governance cluster -->
    <line x1="200" y1="140" x2="150" y2="180" stroke="#bc8cff"/>
    <line x1="200" y1="140" x2="250" y2="180" stroke="#bc8cff"/>
    <line x1="200" y1="140" x2="180" y2="100" stroke="#bc8cff"/>
    <line x1="150" y1="180" x2="250" y2="180" stroke="#bc8cff"/>
    <line x1="200" y1="140" x2="520" y2="160" stroke="#58a6ff" opacity="0.4"/>

    <!-- Architecture cluster -->
    <line x1="340" y1="200" x2="290" y2="240" stroke="#bc8cff"/>
    <line x1="340" y1="200" x2="390" y2="240" stroke="#bc8cff"/>
    <line x1="340" y1="200" x2="310" y2="170" stroke="#bc8cff"/>
    <line x1="340" y1="200" x2="370" y2="170" stroke="#bc8cff"/>
    <line x1="290" y1="240" x2="390" y2="240" stroke="#bc8cff"/>
    <line x1="340" y1="200" x2="400" y2="265" stroke="#bc8cff"/>
    <line x1="340" y1="200" x2="520" y2="160" stroke="#58a6ff" opacity="0.3"/>

    <!-- Security cluster (RED - veto power) -->
    <line x1="480" y1="280" x2="430" y2="310" stroke="#f85149"/>
    <line x1="480" y1="280" x2="530" y2="310" stroke="#f85149"/>
    <line x1="480" y1="280" x2="450" y2="250" stroke="#f85149"/>
    <line x1="430" y1="310" x2="530" y2="310" stroke="#f85149"/>
    <line x1="480" y1="280" x2="600" y2="120" stroke="#f85149" opacity="0.5"/>

    <!-- Implementation cluster -->
    <line x1="750" y1="240" x2="700" y2="270" stroke="#3fb950"/>
    <line x1="750" y1="240" x2="800" y2="270" stroke="#3fb950"/>
    <line x1="750" y1="240" x2="720" y2="210" stroke="#3fb950"/>
    <line x1="750" y1="240" x2="780" y2="210" stroke="#3fb950"/>
    <line x1="700" y1="270" x2="800" y2="270" stroke="#3fb950"/>
    <line x1="750" y1="240" x2="680" y2="160" stroke="#58a6ff" opacity="0.3"/>

    <!-- QA cluster -->
    <line x1="900" y1="200" x2="860" y2="230" stroke="#f0883e"/>
    <line x1="900" y1="200" x2="940" y2="230" stroke="#f0883e"/>
    <line x1="900" y1="200" x2="880" y2="170" stroke="#f0883e"/>
    <line x1="900" y1="200" x2="920" y2="170" stroke="#f0883e"/>
    <line x1="860" y1="230" x2="940" y2="230" stroke="#f0883e"/>
    <line x1="900" y1="200" x2="680" y2="160" stroke="#58a6ff" opacity="0.3"/>

    <!-- Operations cluster -->
    <line x1="1020" y1="140" x2="980" y2="170" stroke="#39d2c0"/>
    <line x1="1020" y1="140" x2="1060" y2="170" stroke="#39d2c0"/>
    <line x1="1020" y1="140" x2="1000" y2="110" stroke="#39d2c0"/>
    <line x1="1020" y1="140" x2="1040" y2="110" stroke="#39d2c0"/>
    <line x1="980" y1="170" x2="1060" y2="170" stroke="#39d2c0"/>
    <line x1="1020" y1="140" x2="680" y2="160" stroke="#58a6ff" opacity="0.3"/>
    <line x1="1020" y1="140" x2="1050" y2="200" stroke="#39d2c0"/>
  </g>

  <!-- Node glows (behind nodes) -->
  <g filter="url(#blur-lg)">
    <circle cx="600" cy="120" r="20" fill="#58a6ff" opacity="0.15"/>
    <circle cx="480" cy="280" r="18" fill="#f85149" opacity="0.15"/>
    <circle cx="200" cy="140" r="14" fill="#bc8cff" opacity="0.12"/>
    <circle cx="750" cy="240" r="14" fill="#3fb950" opacity="0.12"/>
    <circle cx="900" cy="200" r="14" fill="#f0883e" opacity="0.12"/>
    <circle cx="1020" cy="140" r="14" fill="#39d2c0" opacity="0.12"/>
  </g>

  <!-- Agent nodes -->
  <g>
    <!-- META cluster (blue) - 00, 24, 25, 26, 28 -->
    <circle cx="600" cy="120" r="6" fill="#58a6ff" opacity="0.9"/>
    <circle cx="520" cy="160" r="4" fill="#58a6ff" opacity="0.7"/>
    <circle cx="680" cy="160" r="4" fill="#58a6ff" opacity="0.7"/>
    <circle cx="560" cy="80" r="3.5" fill="#58a6ff" opacity="0.6"/>
    <circle cx="640" cy="80" r="3.5" fill="#58a6ff" opacity="0.6"/>
    <circle cx="600" cy="70" r="3" fill="#58a6ff" opacity="0.5"/>

    <!-- Governance cluster (purple) - 01, 02, 03, 32 -->
    <circle cx="200" cy="140" r="4.5" fill="#bc8cff" opacity="0.8"/>
    <circle cx="150" cy="180" r="3.5" fill="#bc8cff" opacity="0.6"/>
    <circle cx="250" cy="180" r="3.5" fill="#bc8cff" opacity="0.6"/>
    <circle cx="180" cy="100" r="3" fill="#bc8cff" opacity="0.5"/>

    <!-- Architecture cluster (purple) - 04, 05, 06, 07, 27, 33 -->
    <circle cx="340" cy="200" r="4.5" fill="#bc8cff" opacity="0.8"/>
    <circle cx="290" cy="240" r="3.5" fill="#bc8cff" opacity="0.6"/>
    <circle cx="390" cy="240" r="3.5" fill="#bc8cff" opacity="0.6"/>
    <circle cx="310" cy="170" r="3" fill="#bc8cff" opacity="0.5"/>
    <circle cx="370" cy="170" r="3" fill="#bc8cff" opacity="0.5"/>
    <circle cx="400" cy="265" r="3" fill="#bc8cff" opacity="0.5"/>

    <!-- Security cluster (red) - 08, 09, 10, 11 -->
    <circle cx="480" cy="280" r="5.5" fill="#f85149" opacity="0.9"/>
    <circle cx="430" cy="310" r="3.5" fill="#f85149" opacity="0.6"/>
    <circle cx="530" cy="310" r="3.5" fill="#f85149" opacity="0.6"/>
    <circle cx="450" cy="250" r="3" fill="#f85149" opacity="0.5"/>

    <!-- Implementation cluster (green) - 12, 13, 14, 15, 16 -->
    <circle cx="750" cy="240" r="4.5" fill="#3fb950" opacity="0.8"/>
    <circle cx="700" cy="270" r="3.5" fill="#3fb950" opacity="0.6"/>
    <circle cx="800" cy="270" r="3.5" fill="#3fb950" opacity="0.6"/>
    <circle cx="720" cy="210" r="3" fill="#3fb950" opacity="0.5"/>
    <circle cx="780" cy="210" r="3" fill="#3fb950" opacity="0.5"/>

    <!-- QA cluster (orange) - 17, 18, 19, 20, 31 -->
    <circle cx="900" cy="200" r="4.5" fill="#f0883e" opacity="0.8"/>
    <circle cx="860" cy="230" r="3.5" fill="#f0883e" opacity="0.6"/>
    <circle cx="940" cy="230" r="3.5" fill="#f0883e" opacity="0.6"/>
    <circle cx="880" cy="170" r="3" fill="#f0883e" opacity="0.5"/>
    <circle cx="920" cy="170" r="3" fill="#f0883e" opacity="0.5"/>

    <!-- Operations cluster (cyan) - 21, 22, 23, 29, 30 -->
    <circle cx="1020" cy="140" r="4.5" fill="#39d2c0" opacity="0.8"/>
    <circle cx="980" cy="170" r="3.5" fill="#39d2c0" opacity="0.6"/>
    <circle cx="1060" cy="170" r="3.5" fill="#39d2c0" opacity="0.6"/>
    <circle cx="1000" cy="110" r="3" fill="#39d2c0" opacity="0.5"/>
    <circle cx="1040" cy="110" r="3" fill="#39d2c0" opacity="0.5"/>
    <circle cx="1050" cy="200" r="3" fill="#39d2c0" opacity="0.5"/>
  </g>

  <!-- Node labels for main agents -->
  <g font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="8" fill="#8b949e" opacity="0.7">
    <text x="600" y="108" text-anchor="middle" font-size="9" fill="#58a6ff" opacity="0.9">00</text>
    <text x="520" y="152" text-anchor="middle">24</text>
    <text x="680" y="152" text-anchor="middle">28</text>
    <text x="480" y="270" text-anchor="middle" font-size="9" fill="#f85149" opacity="0.9">08</text>
    <text x="200" y="132" text-anchor="middle">01</text>
    <text x="340" y="192" text-anchor="middle">04</text>
    <text x="750" y="232" text-anchor="middle">12</text>
    <text x="900" y="192" text-anchor="middle">17</text>
    <text x="1020" y="132" text-anchor="middle">21</text>
  </g>

  <!-- Layer labels -->
  <g font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e" opacity="0.45" letter-spacing="2">
    <text x="200" y="210" text-anchor="middle">GOVERNANCE</text>
    <text x="340" y="275" text-anchor="middle">ARCHITECTURE</text>
    <text x="480" y="340" text-anchor="middle" fill="#f85149" opacity="0.5">SECURITY</text>
    <text x="750" y="298" text-anchor="middle">IMPLEMENTATION</text>
    <text x="900" y="258" text-anchor="middle">QUALITY</text>
    <text x="1020" y="225" text-anchor="middle">OPERATIONS</text>
  </g>

  <!-- Title -->
  <g filter="url(#text-glow)">
    <text x="600" y="365" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="#e6edf3" letter-spacing="8">VANTAGE</text>
  </g>
  <text x="600" y="390" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" letter-spacing="3" opacity="0.7">VERIFIED AGENT NETWORK FOR TRUSTED, GOVERNED ENGINEERING</text>

  <!-- Veto power indicator -->
  <g opacity="0.6">
    <line x1="480" y1="280" x2="600" y2="120" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.4"/>
    <text x="545" y="195" font-family="'SF Mono', monospace" font-size="7" fill="#f85149" opacity="0.6" transform="rotate(-35, 545, 195)">VETO POWER</text>
  </g>
</svg>
