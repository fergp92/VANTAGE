# VANTAGE v2.1 Configuration — Real-Time Application Blueprint
# Generated by: usdaf init --blueprint realtime-app

project:
  name: "{{PROJECT_NAME}}"
  description: "{{DESCRIPTION}}"
  stack: [react, fastify, ws, redis, postgresql]
  ui_kit: usdaf-ui-boilerplate

team:
  preset: full-stack-app
  core: [00, 08, 27, 28]
  active: [00, 02, 04, 05, 06, 07, 08, 09, 12, 13, 14, 15, 16, 17, 18, 27, 28]
  customizations:
    added: [07-infrastructure]
    removed: []

memory:
  injection_budget: 500
  compaction_threshold: 8000
  graduation: auto

scout:
  cache_ttl_days: 90
  registries: [npm, github]
  license_whitelist: [MIT, Apache-2.0, BSD-3-Clause, ISC]

maintenance:
  auto_trigger_days: 30
  cve_sources: [npm-audit, github-advisories]

tiers:
  heavy: [04, 07, 08]
  standard: [02, 05, 06, 09, 12, 13, 15, 17, 27]
  light: [14, 16, 18, 28]
  model_map:
    heavy: opus
    standard: sonnet
    light: haiku

drift:
  check_interval: 5
  threshold: 0.3
  auto_pause: true

gates:
  timeout_ms: 30000

parallel:
  enabled: true
  max_concurrent: 4
  isolation: worktree
  conflict_strategy: flag

fast_path:
  enabled: true
  transforms: [var-to-const, remove-console, sort-imports, remove-unused-imports, normalize-quotes, add-strict]
  fallback_to_agent: true

tokens:
  show_estimate: true
  track_actual: true
