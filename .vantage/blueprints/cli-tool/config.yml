# VANTAGE v2.1 Configuration — CLI Tool Blueprint
# Generated by: usdaf init --blueprint cli-tool

project:
  name: "{{PROJECT_NAME}}"
  description: "{{DESCRIPTION}}"
  stack: [node, commander, chalk]

team:
  preset: minimum-viable
  core: [00, 08, 27, 28]
  active: [00, 02, 08, 12, 17, 18, 23, 27, 28]
  customizations:
    added: [23-documentation]
    removed: []

memory:
  injection_budget: 500
  compaction_threshold: 8000
  graduation: auto

scout:
  cache_ttl_days: 90
  registries: [npm, github]
  license_whitelist: [MIT, Apache-2.0, BSD-3-Clause, ISC]

maintenance:
  auto_trigger_days: 30
  cve_sources: [npm-audit, github-advisories]

tiers:
  heavy: [08]
  standard: [02, 12, 17, 27]
  light: [18, 23, 28]
  model_map:
    heavy: opus
    standard: sonnet
    light: haiku

drift:
  check_interval: 5
  threshold: 0.3
  auto_pause: true

gates:
  timeout_ms: 30000

parallel:
  enabled: false
  max_concurrent: 2
  isolation: worktree
  conflict_strategy: flag

fast_path:
  enabled: true
  transforms: [var-to-const, remove-console, sort-imports, remove-unused-imports, normalize-quotes, add-strict]
  fallback_to_agent: true

tokens:
  show_estimate: true
  track_actual: true
