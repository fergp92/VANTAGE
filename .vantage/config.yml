# VANTAGE v2.0 Configuration
# Generated by: npx vantage init

project:
  name: ""
  description: ""
  stack: []

team:
  preset: "minimum-viable"
  agents_override: []

memory:
  injection_budget: 500
  compaction_threshold: 8000
  graduation: auto

scout:
  cache_ttl_days: 90
  registries: [npm, github]
  license_whitelist: [MIT, Apache-2.0, BSD-3-Clause, ISC]

maintenance:
  auto_trigger_days: 30
  cve_sources: [npm-audit, github-advisories]
  evaluation_stale_days: 180
  lock_stale_minutes: 30

tokens:
  show_estimate: true
  track_actual: true

prompt_cache:
  enabled: true
  strategy: ephemeral        # 'ephemeral' (5-min TTL) or 'extended' (1-hour TTL)
  cache_agent_prompts: true  # Cache static agent definitions across dispatches
  cache_toolkit_indices: true # Cache toolkit indices across dispatches
  cache_project_context: true # Cache project stack and specs within session

toolkit:
  general_index: general           # Shared toolkit index applied to all agents
  merge_strategy: specialized-wins # 'specialized-wins' (default) or 'general-wins'
  prompt_on_start: true            # Ask user about toolkit preferences at project start
  auto_discover: true              # Auto-discover best-rated GitHub repos for standards

ceremony:
  default: standard
  levels:
    quick:
      description: "Single agent, focused task. Bug fixes, config changes, one-file edits."
      phases: [4-implementation]
      agents: [00]
      security: checklist-only
      max_tokens: 20000
    standard:
      description: "Core team, existing architecture. Features within established patterns."
      phases: [0-kickoff, 3-security-light, 4-implementation, 5-qa]
      agents: core
      security: threat-review
      max_tokens: 80000
    full:
      description: "Full team, all phases. New features requiring spec changes."
      phases: [0-kickoff, 1-discovery, 2-architecture, 3-security, 4-implementation, 5-qa, 6-operations, 7-governance]
      agents: preset
      security: full-stride
      max_tokens: 200000
    enterprise:
      description: "Full + compliance + architecture board review. Regulated industries."
      phases: [0-kickoff, 1-discovery, 2-architecture, 3-security, 4-implementation, 5-qa, 6-operations, 7-governance]
      agents: custom
      security: full-stride-plus-compliance
      max_tokens: 400000
      extras: [compliance-audit, architecture-board-review, pen-test-coordination]

git:
  strategy: atomic
  strategies:
    atomic:
      description: "One commit per backlog item, feature branches per sprint"
      commit_style: conventional
    squash:
      description: "Squash merge to main at phase gates"
      commit_style: conventional
    trunk:
      description: "Continuous integration to main with feature flags"
      commit_style: conventional

tiers:
  heavy: ['01', '04', '08', '11']
  standard: ['02', '03', '05', '06', '09', '10', '12', '13', '15', '17', '19', '20', '24', '25', '26', '27']
  light: ['07', '14', '16', '18', '22', '23', '28', '29', '30', '31', '32', '33']
  model_map:
    heavy: opus
    standard: sonnet
    light: haiku

drift:
  check_interval: 5
  threshold: 0.3
  auto_pause: true
  weights:
    missing_ref: 0.4
    orphaned_spec: 0.3
    scope_creep: 0.2
    naming: 0.1

gates:
  timeout_ms: 30000
  hooks:
    G0:
      pre: [validate-spec-completeness]
      post: [log-gate-result]
    G3:
      pre: [validate-spec-contracts]
      post: [update-sprint-status, log-gate-result]

patterns:
  max_injection_tokens: 500
  auto_capture: true
  directory: memory/patterns

fast_path:
  enabled: true
  transforms: [var-to-const, remove-console, sort-imports, remove-unused-imports, normalize-quotes, add-strict]
  fallback_to_agent: true

parallel:
  enabled: true
  max_concurrent: 4
  isolation: worktree
  conflict_strategy: flag

providers:
  primary: anthropic
  fallback: [openai, google]
  local_dev: ollama
  routing:
    strategy: cost
    max_retries: 2
    timeout_ms: 30000
    health_check_interval_ms: 300000
