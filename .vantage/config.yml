# VANTAGE v2.0 Configuration
# Generated by: npx vantage init

project:
  name: ""
  description: ""
  stack: []

team:
  preset: "minimum-viable"
  agents_override: []

memory:
  injection_budget: 500
  compaction_threshold: 8000
  graduation: auto

scout:
  cache_ttl_days: 90
  registries: [npm, github]
  license_whitelist: [MIT, Apache-2.0, BSD-3-Clause, ISC]

maintenance:
  auto_trigger_days: 30
  cve_sources: [npm-audit, github-advisories]

tokens:
  show_estimate: true
  track_actual: true

ceremony:
  default: standard
  levels:
    quick:
      description: "Single agent, focused task. Bug fixes, config changes, one-file edits."
      phases: [4-implementation]
      agents: [00]
      security: checklist-only
      max_tokens: 20000
    standard:
      description: "Core team, existing architecture. Features within established patterns."
      phases: [0-kickoff, 3-security-light, 4-implementation, 5-qa]
      agents: core
      security: threat-review
      max_tokens: 80000
    full:
      description: "Full team, all phases. New features requiring spec changes."
      phases: [0-kickoff, 1-discovery, 2-architecture, 3-security, 4-implementation, 5-qa, 6-operations, 7-governance]
      agents: preset
      security: full-stride
      max_tokens: 200000
    enterprise:
      description: "Full + compliance + architecture board review. Regulated industries."
      phases: [0-kickoff, 1-discovery, 2-architecture, 3-security, 4-implementation, 5-qa, 6-operations, 7-governance]
      agents: custom
      security: full-stride-plus-compliance
      max_tokens: 400000
      extras: [compliance-audit, architecture-board-review, pen-test-coordination]

git:
  strategy: atomic
  strategies:
    atomic:
      description: "One commit per backlog item, feature branches per sprint"
      commit_style: conventional
    squash:
      description: "Squash merge to main at phase gates"
      commit_style: conventional
    trunk:
      description: "Continuous integration to main with feature flags"
      commit_style: conventional
